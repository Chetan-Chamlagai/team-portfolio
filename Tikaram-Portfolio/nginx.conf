server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;

    # Behind Nginx Proxy Manager: keep redirects relative so they stay on
    # https://team.mytufan.com instead of leaking http://...:8081
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Clean URLs: / instead of /index.html, /sandip instead of /sandip.html
    location = /index.html { return 301 /; }
    location = /index      { return 301 /; }

    # Old /html/... links keep working
    location ~ ^/html/(.*)$ { return 301 /$1; }

    location ~ ^/(.+)\.html$ { return 301 /$1; }

    location ~* \.(css|js|jpe?g|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Serve the file directly (no internal redirect, so no loop with the 301 above)
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
