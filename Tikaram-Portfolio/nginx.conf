server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;

    # Behind Nginx Proxy Manager: keep redirects relative so they stay on
    # https://team.mytufan.com instead of leaking http://...:8081
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Pages live in /html and use ../css, ../images, so send the root there
    location = / {
        return 302 /html/index.html;
    }

    location ~* \.(css|js|jpe?g|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
